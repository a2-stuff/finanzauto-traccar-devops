name: Rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente a revertir"
        required: true
        default: "prod"
        type: choice
        options: [dev, uat, prod]

jobs:
  rollback:
    name: Rollback a la revision anterior
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, floci]
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Ejecutar rollback
        run: scripts/rollback.sh ${{ inputs.environment }}
