name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  iac:
    name: Validar y escanear IaC
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init (sin backend)
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          framework: terraform
          soft_fail: false
          config_file: .checkov.yaml
          output_format: cli

      - name: Instalar Trivy
        working-directory: .
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/v0.76.2/contrib/install.sh | sh -s -- -b /usr/local/bin v0.76.2
          trivy version

      - name: Trivy IaC
        working-directory: .
        run: trivy config --severity CRITICAL,HIGH --exit-code 1 --ignorefile .trivyignore infra

  image:
    name: Construir y escanear imagen
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        run: docker build -t traccar-avl:${{ github.sha }} .

      - name: Instalar Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/v0.76.2/contrib/install.sh | sh -s -- -b /usr/local/bin v0.76.2
          trivy version

      - name: Trivy image
        run: trivy image --severity CRITICAL --exit-code 1 --ignore-unfixed "traccar-avl:${{ github.sha }}"
